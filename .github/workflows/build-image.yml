name: Build and push S5A3 GM Tool image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Source branch in this repo to build
        required: true
        type: string
        default: patched
  push:
    branches: [main, master]

permissions:
  contents: read
  packages: write

env:
  DEFAULT_REF: patched
  IMAGE: ghcr.io/oyxp233/s5a3-gm

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'patched' }}

      - name: Extract source snapshot
        run: |
          # 该分支由 GitHub API 推送，内容为 Gitee 源码归档
          mkdir -p src
          tar -xzf source.tar.gz -C src
          sed -i '1i # syntax=docker/dockerfile:1' src/gm/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          # GM 的 go.mod/go.sum 在 gm/ 子目录，构建上下文必须是它而不是仓库根
          context: ./src/gm
          file: ./src/gm/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.run_number }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}

      - name: Make package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/$(basename "$IMAGE")/visibility" \
            -f visibility=public
